# MDVRP benchmark: three multi-depot solvers on all Cordeau p/pr instances.
# VRPSolverEasy is excluded from MDVRP (no multi-depot support).
run_id: mdvrp_benchmark
seeds: [0, 1, 2, 3, 4, 5]
time_budget:
  base_s: 10
  per_node_ms: 0
results_dir: results
solvers: [pyvrp, ortools, vroom]
datasets:
  - variant: MDVRP
    instances:
      - data/instances/MDVRP/old/p01.txt
      - data/instances/MDVRP/old/p02.txt
