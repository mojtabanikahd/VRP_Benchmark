# SDVRP full benchmark: all 35 Cordeau site-dependent instances (old p01-p23,
# new pr01-pr12) across the standalone Tabu Search and the three base-seeded
# wrappers. Flat per-instance budget (no per-node scaling).
#
# NOTE ON COST: the Tabu Search is wall-clock bounded, so every cell runs for the
# full budget unless it converges early (no improvement for 100 iterations). The
# largest old instances (p13-class) and the new pr06/pr12 are the heavy ones; raise
# base_s for a deeper search.
run_id: sdvrp_benchmark
seeds: [0]
time_budget:
  base_s: 60
  per_node_ms: 0
results_dir: results
solvers: [sdvrp_tabu, sdvrp_pyvrp, sdvrp_ortools, sdvrp_vroom]
datasets:
  - variant: SDVRP
    instances:
      - data/instances/SDVRP/old/p01.txt
      - data/instances/SDVRP/old/p02.txt
      - data/instances/SDVRP/old/p03.txt
      - data/instances/SDVRP/old/p04.txt
      - data/instances/SDVRP/old/p05.txt
      - data/instances/SDVRP/old/p06.txt
      - data/instances/SDVRP/old/p07.txt
      - data/instances/SDVRP/old/p08.txt
      - data/instances/SDVRP/old/p09.txt
      - data/instances/SDVRP/old/p10.txt
