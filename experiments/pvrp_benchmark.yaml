# PVRP full benchmark: all 42 Cordeau instances (old p01-p32, new pr01-pr10)
# across the three PVRP wrappers. Flat per-instance budget (no per-node scaling).
#
# NOTE ON COST: each PVRPSolver runs t inner routing solves per ALNS iteration
# (t up to 10), and the largest instances are big (p13: n=417, t=7; pr06/pr10:
# n=288). Per-day solution caching limits re-solves, but expect the giants to
# complete only a modest number of ALNS iterations at this budget. Raise base_s
# (or drop the largest instances) for a deeper search.
run_id: pvrp_benchmark
seeds: [0]
time_budget:
  base_s: 60
  per_node_ms: 0
results_dir: results
solvers: [pvrp_pyvrp, pvrp_ortools, pvrp_vroom]
datasets:
  - variant: PVRP
    instances:
      - data/instances/PVRP/old/p01.txt
      - data/instances/PVRP/old/p02.txt
      - data/instances/PVRP/old/p03.txt
      - data/instances/PVRP/old/p04.txt
