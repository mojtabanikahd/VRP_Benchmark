[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vrpbench"
version = "0.1.0"
description = "Fast, reproducible VRP benchmarking harness for CVRP and VRPTW"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "vrplib>=1.4,<2",
    "pyvrp>=0.9,<0.12",
    "ortools>=9.10,<10",
    "pyyaml>=6.0,<7",
    "pandas>=2.0,<4",
    "pyvroom>=1.15,<2",
    "VRPSolverEasy>=0.1.4,<0.2",
    "alns>=7,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[project.scripts]
vrpbench = "vrpbench.cli:main"

[tool.setuptools.packages.find]
include = ["vrpbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
